<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Owedco</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#090E1A;--navy-edge:#1C2A3E;--gold:#C9A84C;--white:#FFFFFF;--text-dim:#6B7E96;--text-body:#A8BCCE;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--navy);color:var(--white);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;}
.num{font-family:'DM Serif Display',serif;font-size:96px;color:var(--gold);line-height:1;margin-bottom:16px;opacity:0.7;}
h1{font-family:'DM Serif Display',serif;font-size:28px;color:var(--white);margin-bottom:12px;}
p{font-size:15px;color:var(--text-dim);line-height:1.65;max-width:360px;margin-bottom:32px;}
.btn{display:inline-block;background:var(--gold);color:#160F00;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:12px 26px;border-radius:9px;text-decoration:none;transition:transform 0.15s;}
.btn:hover{transform:translateY(-1px);}
.links{margin-top:24px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.links a{font-size:13px;color:var(--text-dim);text-decoration:none;transition:color 0.14s;}
.links a:hover{color:var(--white);}
</style>
<link rel="icon" type="image/png" href="/logo.png">
</head>
<body>
  <div class="num">404</div>
  <h1>This page doesn't exist</h1>
  <p>The page you're looking for isn't here but your R&D Tax Credit might does.</p>
  <a class="btn" href="/">Go back home</a>
  <div class="links">
    <a href="/blog">Read our guides</a>
    <a href="/contact">Contact us</a>
    <a href="/about">About Owedco</a>
  </div>
</body>
</html>
